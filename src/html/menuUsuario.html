<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitaQ - Inicio</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>

<body>
    <header>
        <a href="index.html"><img src="../img/favicon.png" alt="HabitaQ" width="100"><h1>HabitaQ</h1></a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formBusqueda.html">Búsqueda Avanzada</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="userSection">
            <button>Editar datos</button>
            <form id="datosUser" action="get">
                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario" pattern="[A-Za-z][A-Za-z0-9]{2,14}" minlength="3" maxlength="15" required value="Laura">
                <br>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9_-]{6,15}" minlength="6" maxlength="15" required value="Pass1234">
                <br>
                <label for="email">Dirección de email:</label>
                <input type="email" id="email" name="email" required value="Laura@gmail.com">
                <br>
                <label for="sexo">Sexo</label>
                <select name="sexo" id="sexo" required>
                    <option value="Hombre">Hombre</option>
                    <option value="Mujer" selected>Mujer</option>
                    <option value="Otro">Otro</option>
                    <option value="Prefiero no especificarlo">Prefiero no especificarlo</option>
                </select>
                <br>
                <label for="birthdate">Fecha de nacimiento</label>
                <input type="date" id="birthdate" name="birthdate" required value="1995-05-20">
                <br>
                <label for="city">Ciudad</label>
                <input type="text" name="city" id="city" value="Alicante">
                <br>
                <label for="country">País de residencia</label>
                <select name="country" id="country">
                    <option value="Alemania">Alemania</option>
                    <option value="Australia">Australia</option>
                    <option value="Canadá">Canadá</option>
                    <option value="España" selected>España</option>
                    <option value="Estados Unidos">Estados Unidos</option>
                    <option value="Francia">Francia</option>
                    <option value="Italia">Italia</option>
                    <option value="Japón">Japón</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Reino Unido">Reino Unido</option>
                </select>
                <br>
                <label for="foto">Foto:</label>
                <input type="file" name="foto" id="foto">
                <img src="../img/user.png" width="100">
                <br>
                <input type="submit" value="Actualizar Datos">
            </form>
            <br>
            <button>Darse de baja</button>
        </section>
        <br>
        <br>
        <section>
            <a href="error404.html">Tus anuncios</a>
            <a href="error404.html">Crear anuncio</a>
            <a href="misMensajes.html">Mis mensajes</a>
            <a href="solicitarFolleto.html">Solicitar folleto publicitario impreso</a>
            <a href="index.html">Salir</a>
        </section>
    </main>
    <footer>
        <p>Pau Cremades García. Antonio Carbonell Gómez</p>
        <p>&copy;Copyright 2026</p>
        <p>Desarrollo de Aplicaciones Web. Universidad de Alicante - Ingeniería multimedia 3º Curso</p>
    </footer>
</body>

</html>
