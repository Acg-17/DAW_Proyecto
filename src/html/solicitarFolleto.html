<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitaQ - Inicio</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>

<body>
    <header>
        <a href="index.html"><img src="../img/favicon.png" alt="HabitaQ" width="100"><h1>HabitaQ</h1></a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formBusqueda.html">Búsqueda Avanzada</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <fieldset>
                <legend>Información personal</legend>

                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="nombre" maxlength="200" required>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" maxlength="200" required>
                <fieldset>
                    <legend>Dirección</legend>
                    
                    <label for="calle">Calle:</label>
                    <input type="text" id="calle" name="calle" required>
                    <label for="numero">Nº:</label>
                    <input type="text" id="numero" name="numero" required><br>
                    <label for="portal">Portal:</label>
                    <input type="text" id="portal" name="portal">
                    <label for="piso">Piso:</label>
                    <input type="text" id="piso" name="piso">
                    <label for="letra">Letra:</label>
                    <input type="text" id="letra" name="letra">
                </fieldset>
                <label for="tel">Teléfono:</label>
                <input type="tel" id="tel" name="tel">
            </fieldset>
            <fieldset>
                <legend>Folleto</legend>
                <label for="col">Color de la portada:</label>
                <input type="color" id="col" name="col" required><br>
                <label for="copias">Número de copias:</label>
                <input type="number" id="copias" name="copias" min="1" max="99" required><br>
                <label for="res">Resolución de las fotos (DPI):</label>
                <input type="range" id="res" name="res" min="150" max="900" step="150"><br>
                <label for="anuncio">Anuncio a imprimir:</label>
                <select name="anuncio" id="anuncio" required>
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="Anuncio1">Anuncio1</option>
                    <option value="Anuncio2">Anuncio2</option>
                    <option value="Anuncio3">Anuncio3</option>
                </select><br>
                <label for="fecha">Fecha de recepción:</label>
                <input type="date" id="fecha" name="fecha"><br>
                <fieldset>
                    <legend>Opciones adicionales:</legend>

                    <label for="color">Impresión a color</label>
                    <input type="checkbox" id="color" name="color">
                    <label for="precio">Impresión del precio</label>
                    <input type="checkbox" id="precio" name="precio">
                </fieldset>
                <label for="AdT">Texto Adicional:</label>
            <textarea id="AdT" name="AdT" maxlength="4000"></textarea>
            </fieldset>
            <input type="submit" value="Solicitar Folleto">
            

        </section>
    </main>
    <footer>
        <p>Pau Cremades García. Antonio Carbonell Gómez</p>
        <p>&copy;Copyright 2026</p>
        <p>Desarrollo de Aplicaciones Web. Universidad de Alicante - Ingeniería multimedia 3º Curso</p>
    </footer>
</body>

</html>
