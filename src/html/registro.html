<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitaQ - Registro</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>

<body>
    <header>
        <a href="index.html"><img src="../img/favicon.png" width="100">
            <h1>HabitaQ</h1>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formBusqueda.html">Búsqueda Avanzada</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <form>
                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario" pattern="[A-Za-z][A-Za-z0-9]{2,14}" minlength="3" maxlength="15" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9_-]{6,15}" minlength="6" maxlength="15" required>

                <label for="repPass">Repetir contraseña</label>
                <input type="password" id="repPass" name="repPass" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])[A-Za-z0-9_-]{6,15}" minlength="6" maxlength="15" required>

                <label for="email">Dirección de email:</label>
                <input type="email" id="email" name="email" pattern="[A-Za-z0-9!#$%&'*+\-/=?^_`{|}~]+(\.[A-Za-z0-9!#$%&'*+\-/=?^_`{|}~]+)*@[A-Za-z0-9]+([.-][A-Za-z0-9]+)*" maxlength="254" required>

                <label for="sexo">Sexo</label>
                <select name="sexo" id="sexo" required>
                    <option value="Hombre">Hombre</option>
                    <option value="Hombre">Mujer</option>
                    <option value="Hombre">Otro</option>
                    <option value="Hombre">Prefiero no especificarlo</option>
                </select>

                <label for="birthdate">Fecha de nacimiento</label>
                <input type="date" required>

                <label for="city">Ciudad</label>
                <input type="text" name="city" id="city">

                <label for="country">País de residencia</label>
                <select name="country" id="country">
                    <option value="Spain">Spain</option>
                    <option value="France">France</option>
                    <option value="Italy">Italy</option>
                    <option value="Germany">Germany</option>
                    <option value="Portugal">Portugal</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="United States">United States</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="Japan">Japan</option>
                </select>

                <label for="foto">Foto:</label>
                <input type="file" name="foto" id="foto">

                <input type="submit" value="Entrar">
            </form>
        </section>
    </main>
    <footer>
        <p>Pau Cremades García. Antonio Carbonell Gómez</p>
        <p>&copy;Copyright 2026</p>
        <p>Desarrollo de Aplicaciones Web. Universidad de Alicante - Ingeniería multimedia 3º Curso</p>
    </footer>
</body>

</html>
